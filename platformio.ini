; UbxGnss is a library: the firmwares build its src/ themselves (NeptuneGPS Salacia and
; NeptuneGPS Proteus, each as the git submodule lib/UbxGnss). This file only builds the
; native AUnit suite, the same shape as the consumers' own [env:native]:
;
;   pio run -e native && .pio/build/native/program
[platformio]
default_envs = native

[env:native]
platform = native
; Every source is named below; nothing is auto-discovered.
lib_ldf_mode = off
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wno-unused-parameter
    ; AUnit's own Assertion.cpp casts a pointer to unsigned long, a hard error under
    ; Windows' LLP64 model unless -fpermissive downgrades it.
    -fpermissive
    -D EPOXY_DUINO=1
    -I test/native/support
    -I .pio/libdeps/native/AUnit/src
    -I src
lib_deps =
    bxparks/AUnit@^1.7.1
build_src_filter =
    -<*>
    +<UbxGnssParser.cpp>
    +<../test/native/UbxGnssNativeTests.cpp>
    +<../test/native/support/native_main.cpp>
    +<../test/native/tests/*.cpp>
    +<../.pio/libdeps/native/AUnit/src/aunit/*.cpp>
